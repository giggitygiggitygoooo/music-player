<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleeve — your music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191c20;
    --bg-raised: #21252b;
    --bg-inset: #14171b;
    --ink: #ece6d8;
    --ink-dim: #8b8f95;
    --amber: #e2a344;
    --teal: #4d7d72;
    --line: #2d3138;
    --danger: #b5654f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }
  h1, h2, .title-face { font-family: 'Fraunces', serif; }

  ::selection { background: var(--amber); color: #191c20; }

  button {
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--ink);
  }
  input[type="text"] {
    font-family: 'Space Mono', monospace;
    background: var(--bg-inset);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 13px;
  }
  input[type="text"]:focus { outline: 1px solid var(--amber); }

  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr auto;
    height: 100%;
  }

  /* ---------- Sidebar (the shelf) ---------- */
  .shelf {
    grid-row: 1 / 2;
    background: var(--bg-inset);
    border-right: 1px solid var(--line);
    padding: 22px 16px;
    overflow-y: auto;
  }
  .shelf h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  .shelf .tagline {
    font-size: 11px;
    color: var(--ink-dim);
    margin: 0 0 24px;
  }
  .shelf-section-label {
    font-size: 11px;
    color: var(--ink-dim);
    margin: 18px 0 8px;
  }
  .shelf-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-dim);
    border-left: 2px solid transparent;
  }
  .shelf-item:hover { background: var(--bg-raised); color: var(--ink); }
  .shelf-item.active {
    background: var(--bg-raised);
    color: var(--ink);
    border-left: 2px solid var(--amber);
  }
  .shelf-item .count { font-size: 11px; color: var(--ink-dim); }
  .new-playlist-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .new-playlist-row input { flex: 1; min-width: 0; }
  .new-playlist-row button {
    background: var(--teal);
    color: #eee;
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 12px;
  }
  .new-playlist-row button:hover { filter: brightness(1.15); }

  /* ---------- Main pane ---------- */
  .main {
    grid-row: 1 / 2;
    padding: 30px 40px;
    overflow-y: auto;
  }
  .main-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .main-header h2 {
    font-size: 26px;
    font-weight: 600;
    margin: 0;
  }
  .main-sub {
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 22px;
  }

  .dropzone {
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 30px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    margin-bottom: 24px;
    transition: border-color 0.15s, color 0.15s;
  }
  .dropzone.drag-over {
    border-color: var(--amber);
    color: var(--amber);
  }
  .dropzone button {
    background: var(--amber);
    color: #191c20;
    padding: 9px 16px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 700;
    margin-top: 10px;
  }
  .dropzone button:hover { filter: brightness(1.08); }

  .track-list { list-style: none; margin: 0; padding: 0; }
  .track-row {
    display: grid;
    grid-template-columns: 28px 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 13px;
  }
  .track-row:hover { background: var(--bg-raised); }
  .track-row.playing { background: var(--bg-raised); color: var(--amber); }
  .track-num { color: var(--ink-dim); font-size: 12px; text-align: right; }
  .track-row.playing .track-num { color: var(--amber); }
  .track-name {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .track-dur { color: var(--ink-dim); font-size: 12px; }
  .track-actions { display: flex; gap: 10px; align-items: center; }
  .track-actions button {
    font-size: 12px;
    color: var(--ink-dim);
    padding: 2px 4px;
  }
  .track-actions button:hover { color: var(--ink); }
  .track-actions select {
    font-family: 'Space Mono', monospace;
    background: var(--bg-inset);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    padding: 3px;
  }
  .empty-msg {
    color: var(--ink-dim);
    font-size: 13px;
    padding: 20px 4px;
  }

  /* ---------- Transport bar ---------- */
  .transport {
    grid-column: 1 / 3;
    background: var(--bg-inset);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 260px 1fr 220px;
    align-items: center;
    padding: 12px 24px;
    gap: 20px;
  }
  .now-playing {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .now-playing .nm {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .now-playing .pl {
    font-size: 11px;
    color: var(--ink-dim);
  }
  .transport-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .transport-buttons { display: flex; align-items: center; gap: 18px; }
  .transport-buttons button { font-size: 15px; color: var(--ink-dim); }
  .transport-buttons button:hover { color: var(--ink); }
  .play-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--amber);
    color: #191c20 !important;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .play-btn:hover { filter: brightness(1.1); }
  .toggle-btn.active { color: var(--amber); }
  .seek-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .seek-bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .seek-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--amber);
    border-radius: 2px;
    width: 0%;
  }
  .volume-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .vol-bar {
    width: 90px;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .vol-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--ink-dim);
    border-radius: 2px;
    width: 100%;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app">

  <div class="shelf">
    <h1>Sleeve</h1>
    <p class="tagline">your music, your rules</p>

    <div class="shelf-section-label">library</div>
    <div class="shelf-item active" data-view="library" onclick="selectView('library')">
      <span>All songs</span>
      <span class="count" id="library-count">0</span>
    </div>

    <div class="shelf-section-label">playlists</div>
    <div id="playlist-list"></div>
    <div class="new-playlist-row">
      <input type="text" id="new-playlist-name" placeholder="New playlist…" onkeydown="if(event.key==='Enter')createPlaylist()">
      <button onclick="createPlaylist()">+</button>
    </div>
  </div>

  <div class="main" id="main-pane"></div>

  <div class="transport">
    <div class="now-playing">
      <div class="nm" id="np-name">Nothing playing</div>
      <div class="pl" id="np-playlist">—</div>
    </div>

    <div class="transport-center">
      <div class="transport-buttons">
        <button class="toggle-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">⤨</button>
        <button onclick="playPrev()" title="Previous">◀◀</button>
        <button class="play-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">▶</button>
        <button onclick="playNext()" title="Next">▶▶</button>
        <button class="toggle-btn" id="loop-btn" onclick="cycleLoop()" title="Loop">⟲</button>
      </div>
      <div class="seek-row">
        <span id="cur-time">0:00</span>
        <div class="seek-bar" id="seek-bar" onclick="seekTo(event)">
          <div class="seek-fill" id="seek-fill"></div>
        </div>
        <span id="dur-time">0:00</span>
      </div>
    </div>

    <div class="volume-row">
      <span style="font-size:12px;">vol</span>
      <div class="vol-bar" id="vol-bar" onclick="setVolume(event)">
        <div class="vol-fill" id="vol-fill"></div>
      </div>
    </div>
  </div>

</div>

<input type="file" id="file-input" accept="audio/*" multiple style="display:none" onchange="handleFiles(this.files)">

<script>
  // ---------- State ----------
  let songs = [];          // {id, name, url, duration}
  let playlists = [];      // {id, name, songIds: []}
  let currentView = 'library'; // 'library' or playlist id
  let queue = [];          // ordered array of song ids currently playable
  let currentIndex = -1;   // index into queue
  let loopMode = 'none';   // 'none' | 'one' | 'all'
  let shuffleOn = false;
  let shuffleOrder = [];
  let nextId = 1;

  const audio = new Audio();
  audio.volume = 0.8;

  // ---------- Helpers ----------
  function uid() { return nextId++; }

  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function songById(id) { return songs.find(s => s.id === id); }
  function playlistById(id) { return playlists.find(p => p.id === id); }

  function currentQueueSongIds() {
    if (currentView === 'library') return songs.map(s => s.id);
    const pl = playlistById(currentView);
    return pl ? pl.songIds.slice() : [];
  }

  // ---------- File handling ----------
  function openFilePicker() { document.getElementById('file-input').click(); }

  function handleFiles(fileList) {
    Array.from(fileList).forEach(file => {
      if (!file.type.startsWith('audio/')) return;
      const url = URL.createObjectURL(file);
      const song = { id: uid(), name: file.name.replace(/\.[^/.]+$/, ''), url, duration: null };
      songs.push(song);
      const probe = new Audio(url);
      probe.addEventListener('loadedmetadata', () => {
        song.duration = probe.duration;
        renderMain();
      });
    });
    renderSidebar();
    renderMain();
  }

  function setupDropzone() {
    const zone = document.getElementById('dropzone-el');
    if (!zone) return;
    ['dragenter', 'dragover'].forEach(evt =>
      zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag-over'); })
    );
    ['dragleave', 'drop'].forEach(evt =>
      zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag-over'); })
    );
    zone.addEventListener('drop', e => {
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  }

  // ---------- Playlists ----------
  function createPlaylist() {
    const input = document.getElementById('new-playlist-name');
    const name = input.value.trim();
    if (!name) return;
    const pl = { id: 'pl-' + uid(), name, songIds: [] };
    playlists.push(pl);
    input.value = '';
    renderSidebar();
    selectView(pl.id);
  }

  function deletePlaylist(id, evt) {
    evt.stopPropagation();
    playlists = playlists.filter(p => p.id !== id);
    if (currentView === id) selectView('library');
    else renderSidebar();
  }

  function addToPlaylist(songId, playlistId) {
    if (!playlistId) return;
    const pl = playlistById(playlistId);
    if (pl && !pl.songIds.includes(songId)) {
      pl.songIds.push(songId);
      renderSidebar();
      if (currentView === playlistId) renderMain();
    }
  }

  function removeFromPlaylist(songId) {
    const pl = playlistById(currentView);
    if (!pl) return;
    pl.songIds = pl.songIds.filter(id => id !== songId);
    renderSidebar();
    renderMain();
  }

  function deleteSong(songId, evt) {
    evt.stopPropagation();
    songs = songs.filter(s => s.id !== songId);
    playlists.forEach(p => p.songIds = p.songIds.filter(id => id !== songId));
    renderSidebar();
    renderMain();
  }

  // ---------- View switching ----------
  function selectView(view) {
    currentView = view;
    renderSidebar();
    renderMain();
  }

  // ---------- Rendering ----------
  function renderSidebar() {
    document.getElementById('library-count').textContent = songs.length;
    document.querySelectorAll('.shelf-item[data-view="library"]').forEach(el =>
      el.classList.toggle('active', currentView === 'library')
    );
    const container = document.getElementById('playlist-list');
    container.innerHTML = '';
    playlists.forEach(pl => {
      const div = document.createElement('div');
      div.className = 'shelf-item' + (currentView === pl.id ? ' active' : '');
      div.onclick = () => selectView(pl.id);
      div.innerHTML = `
        <span>${escapeHtml(pl.name)}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <span class="count">${pl.songIds.length}</span>
          <button onclick="deletePlaylist('${pl.id}', event)" title="Delete playlist" style="color:var(--ink-dim); font-size:11px;">✕</button>
        </span>`;
      container.appendChild(div);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderMain() {
    const pane = document.getElementById('main-pane');
    const isLibrary = currentView === 'library';
    const pl = isLibrary ? null : playlistById(currentView);
    const title = isLibrary ? 'All songs' : (pl ? pl.name : 'Playlist');
    const listSongIds = isLibrary ? songs.map(s => s.id) : (pl ? pl.songIds : []);

    let html = `
      <div class="main-header">
        <h2>${escapeHtml(title)}</h2>
      </div>
      <div class="main-sub">${listSongIds.length} track${listSongIds.length === 1 ? '' : 's'}</div>
    `;

    if (isLibrary) {
      html += `
        <div class="dropzone" id="dropzone-el">
          Drop audio files here, or
          <div><button onclick="openFilePicker()">Add songs</button></div>
        </div>
      `;
    }

    if (listSongIds.length === 0) {
      html += `<div class="empty-msg">${isLibrary ? 'No songs yet — add some above.' : 'No songs in this playlist yet. Add some from your library.'}</div>`;
    } else {
      html += '<ul class="track-list">';
      listSongIds.forEach((id, idx) => {
        const song = songById(id);
        if (!song) return;
        const isPlaying = currentView === (queueContextId()) && queue[currentIndex] === id;
        const playlistOptions = playlists
          .filter(p => p.id !== currentView)
          .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`)
          .join('');
        html += `
          <li class="track-row ${isPlaying ? 'playing' : ''}">
            <span class="track-num">${idx + 1}</span>
            <span class="track-name" onclick="playFromView(${id})" title="${escapeHtml(song.name)}">${escapeHtml(song.name)}</span>
            <span class="track-dur">${song.duration ? formatTime(song.duration) : '—'}</span>
            <span class="track-actions">
              ${isLibrary
                ? `<select onchange="addToPlaylist(${id}, this.value); this.selectedIndex=0;">
                     <option value="">+ playlist</option>
                     ${playlistOptions}
                   </select>
                   <button onclick="deleteSong(${id}, event)" title="Delete from library">✕</button>`
                : `<button onclick="removeFromPlaylist(${id})" title="Remove from playlist">✕</button>`
              }
            </span>
          </li>
        `;
      });
      html += '</ul>';
    }

    pane.innerHTML = html;
    setupDropzone();
  }

  // tracks which view the active queue belongs to, so "playing" highlight
  // only shows in the view it was started from
  let queueContext = 'library';
  function queueContextId() { return queueContext; }

  // ---------- Playback ----------
  function playFromView(songId) {
    queue = currentQueueSongIds();
    queueContext = currentView;
    currentIndex = queue.indexOf(songId);
    if (shuffleOn) buildShuffleOrder(currentIndex);
    loadAndPlay();
  }

  function buildShuffleOrder(keepIndex) {
    shuffleOrder = queue.map((_, i) => i).filter(i => i !== keepIndex);
    for (let i = shuffleOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
    }
    if (keepIndex !== undefined && keepIndex !== -1) shuffleOrder.unshift(keepIndex);
  }

  function loadAndPlay() {
    if (currentIndex < 0 || currentIndex >= queue.length) return;
    const song = songById(queue[currentIndex]);
    if (!song) return;
    audio.src = song.url;
    audio.play();
    updateNowPlaying();
    renderMain();
  }

  function togglePlay() {
    if (!audio.src) {
      // nothing loaded yet — play first thing in current view
      const ids = currentQueueSongIds();
      if (ids.length === 0) return;
      queue = ids;
      queueContext = currentView;
      currentIndex = 0;
      if (shuffleOn) buildShuffleOrder(0);
      loadAndPlay();
      return;
    }
    if (audio.paused) audio.play(); else audio.pause();
  }

  function playNext() {
    if (queue.length === 0) return;
    if (shuffleOn) {
      const pos = shuffleOrder.indexOf(currentIndex);
      const nextPos = pos + 1;
      if (nextPos < shuffleOrder.length) {
        currentIndex = shuffleOrder[nextPos];
      } else if (loopMode === 'all') {
        buildShuffleOrder();
        currentIndex = shuffleOrder[0];
      } else {
        audio.pause();
        return;
      }
    } else {
      if (currentIndex + 1 < queue.length) {
        currentIndex++;
      } else if (loopMode === 'all') {
        currentIndex = 0;
      } else {
        audio.pause();
        return;
      }
    }
    loadAndPlay();
  }

  function playPrev() {
    if (queue.length === 0) return;
    // if more than 3s into the song, restart it instead of going back
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    if (shuffleOn) {
      const pos = shuffleOrder.indexOf(currentIndex);
      const prevPos = pos - 1;
      if (prevPos >= 0) currentIndex = shuffleOrder[prevPos];
      else return;
    } else {
      if (currentIndex - 1 >= 0) currentIndex--;
      else return;
    }
    loadAndPlay();
  }

  function toggleShuffle() {
    shuffleOn = !shuffleOn;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffleOn);
    if (shuffleOn && queue.length) buildShuffleOrder(currentIndex);
  }

  function cycleLoop() {
    loopMode = loopMode === 'none' ? 'all' : loopMode === 'all' ? 'one' : 'none';
    const btn = document.getElementById('loop-btn');
    btn.classList.toggle('active', loopMode !== 'none');
    btn.textContent = loopMode === 'one' ? '⟲¹' : '⟲';
  }

  audio.addEventListener('ended', () => {
    if (loopMode === 'one') {
      audio.currentTime = 0;
      audio.play();
    } else {
      playNext();
    }
  });

  audio.addEventListener('play', () => { document.getElementById('play-btn').textContent = '❚❚'; });
  audio.addEventListener('pause', () => { document.getElementById('play-btn').textContent = '▶'; });

  audio.addEventListener('timeupdate', () => {
    document.getElementById('cur-time').textContent = formatTime(audio.currentTime);
    document.getElementById('dur-time').textContent = formatTime(audio.duration);
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    document.getElementById('seek-fill').style.width = pct + '%';
  });

  function seekTo(evt) {
    const bar = document.getElementById('seek-bar');
    const rect = bar.getBoundingClientRect();
    const pct = (evt.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  }

  function setVolume(evt) {
    const bar = document.getElementById('vol-bar');
    const rect = bar.getBoundingClientRect();
    let pct = (evt.clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    audio.volume = pct;
    document.getElementById('vol-fill').style.width = (pct * 100) + '%';
  }

  function updateNowPlaying() {
    const song = songById(queue[currentIndex]);
    document.getElementById('np-name').textContent = song ? song.name : 'Nothing playing';
    const pl = queueContext === 'library' ? 'All songs' : (playlistById(queueContext)?.name || '');
    document.getElementById('np-playlist').textContent = pl;
  }

  // ---------- Init ----------
  document.getElementById('vol-fill').style.width = (audio.volume * 100) + '%';
  renderSidebar();
  renderMain();
</script>

</body>
</html>
